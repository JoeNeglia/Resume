name: Build & Archive Resume

on:
  push:
    paths:
      - 'current/resume.tex'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo (with previous commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Archive previous JoeNeglia_Resume.pdf (if it existed)
        run: |
          set -e
          mkdir -p archive
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git show HEAD^:current/JoeNeglia_Resume.pdf >/dev/null 2>&1; then
              git show HEAD^:current/JoeNeglia_Resume.pdf > archive/JoeNeglia_Resume_$(date +"%Y-%m-%d_%H-%M-%S").pdf
              echo "📦 Archived previous JoeNeglia_Resume.pdf"
            else
              echo "No previous JoeNeglia_Resume.pdf found to archive"
            fi
          else
            echo "No previous commit to inspect"
          fi

      - name: Build LaTeX (resume.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: current/resume.tex
          working_directory: current
          latexmk_use_xelatex: false
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Ensure new PDF is in place
        run: |
          set -e
          echo "Looking for output PDF..."
          # Find any PDF generated by LaTeX
          NEW_PDF=$(find current -maxdepth 1 -name '*.pdf' | head -n 1 || true)

          if [ -z "$NEW_PDF" ]; then
            echo "❌ No PDF found after build. Build may have failed."
            exit 1
          fi

          # Rename whatever PDF was generated to JoeNeglia_Resume.pdf
          mv "$NEW_PDF" current/JoeNeglia_Resume.pdf
          echo "✅ New PDF renamed to JoeNeglia_Resume.pdf"

      - name: Commit updated PDFs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/*.pdf || true
          git add current/JoeNeglia_Resume.pdf || true

          if ! git diff --cached --quiet; then
            git commit -m "chore(resume): rebuild and archive (JoeNeglia_Resume.pdf) $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          else
            echo "ℹ️ No changes to commit"
          fi
