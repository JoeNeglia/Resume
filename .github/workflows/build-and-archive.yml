name: Build and Archive Resume

on:
  push:
    branches:
      - main
    paths:
      - 'current/resume.tex'

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: current/resume.tex
          working_directory: current
      
      - name: Archive previous PDF
        run: |
          if [ -f "resume.pdf" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
            mv resume.pdf "archive/resume_${TIMESTAMP}.pdf"
            echo "Archived previous resume as resume_${TIMESTAMP}.pdf"
          else
            echo "No previous resume.pdf found, skipping archive step"
          fi
      
      - name: Move new PDF to root
        run: |
          mv current/resume.pdf resume.pdf
          echo "New resume.pdf created"
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add resume.pdf archive/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build: Update resume and archive previous version [skip ci]" && git push)